name: with-review
version: 1
description: デフォルトOpenSpecワークフロー（日本語版） - 提案 → 仕様 → 設計 → レビュー → タスク
artifacts:
  - id: proposal
    generates: proposal.md
    description: 変更提案ドキュメント
    template: proposal.md
    instruction: |
      変更提案ドキュメントを作成し、なぜこの変更が必要かを説明する。

      以下のセクションを必ず含める：

      - **なぜ**：1-2文で問題または機会を説明する。何を解決するのか？なぜ今やるのか？
      - **変更内容**：リストで具体的な変更を説明する。新規機能、修正、削除を含める。破壊的変更にはマークをつける。
      - **機能一覧**：作成または修正が必要な仕様（specs）を特定する：
        - **新規機能**：今回導入する機能を列挙する。各機能は `specs/<name>/spec.md` に対応し、kebab-caseで命名する（例：`user-auth`、`data-export`）
        - **修正機能**：要件に変更がある既存機能を列挙する。仕様レベルの動作変更のみを含める（実装詳細は除く）。各機能にはdelta specファイルが必要。先に `openspec/specs/` 下の既存spec名を確認すること。要件変更がない場合は空欄にする。
      - **影響範囲**：影響を受けるコード、API、依存関係、システム

      重要：機能一覧はproposalとspecsフェーズ間の契約である。記入する前に既存のspecsを調査すること。
      列挙した各機能には対応するspecファイルが必要である。

      簡潔に（1-2ページ）。「なぜ」に焦点を当て、「どのように」はdesign.mdに譲る。
    requires: []
  - id: specs
    generates: specs/**/*.md
    description: 変更の詳細な仕様書
    template: spec.md
    instruction: |
      仕様ファイルを作成し、システムが何をすべきかを定義する。

      proposalの機能一覧の各機能についてspecファイルを1つ作成する。
      - 新規機能：proposal内のkebab-case名を使用（specs/<capability>/spec.md）
      - 修正機能：既存のspecディレクトリ名を使用（openspec/specs/<capability>/）、specs/<capability>/spec.mdにdelta specを作成

      Delta操作（## 見出しを使用）：
      - **追加要件（ADDED）**：新規機能
      - **変更要件（MODIFIED）**：動作変更 — 更新内容を完全に含める必要がある
      - **削除要件（REMOVED）**：廃止される機能 — **理由**と**移行方案**を必ず含める
      - **名前変更要件（RENAMED）**：名前のみの変更 — FROM:/TO: 形式を使用

      フォーマット要件：
      - 各要件：`### Requirement: <name>` の後に説明
      - SHALL/MUSTを使用して規範的要件を表現する（should/mayは避ける）
      - 各シナリオ：`#### Scenario: <name>` でWHEN/THEN形式を使用
      - **重要**：シナリオは4つのハッシュ（`####`）を使用すること。3つのハッシュやリストを使用するとサイレントに失敗する
      - 各要件には少なくとも1つのシナリオが必要

      修正要件のワークフロー：
      1. openspec/specs/<capability>/spec.mdで既存の要件を特定する
      2. 要件ブロック全体（`### Requirement:` から全シナリオまで）をコピーする
      3. `## MODIFIED Requirements` の下に貼り付けて新しい動作に編集する
      4. 見出しテキストが完全に一致することを確認する（空白の違いは無視）

      よくある落とし穴：MODIFIEDを使用しながら部分的な内容だけを書くと、アーカイブ時に詳細が失われる。
      既存の動作を変更せずに新しい関心事を追加するだけの場合は、ADDEDを使用すること。

      Specはテスト可能でなければならない — 各シナリオは潜在的なテストケースである。
    requires:
      - proposal
  - id: design
    generates: design.md
    description: 技術設計ドキュメント
    template: design.md
    instruction: |
      技術設計ドキュメントを作成し、この変更をどのように実装するかを説明する。

      design.mdが必要な場合（いずれかに該当すれば作成）：
      - モジュールをまたぐ変更や新しいアーキテクチャパターンが必要
      - 新しい外部依存関係や重大なデータモデル変更の導入
      - セキュリティ、パフォーマンス、または移行の複雑さが関係
      - 曖昧さがあり、コーディング前に技術的決定が必要

      以下のセクションを必ず含める：
      - **背景**：現状、制約、ステークホルダー
      - **目標 / 非目標**：この設計で達成すべきことと、明確に除外するもの
      - **主要な決定**：技術選定とその理由（なぜXを選びYを選ばないのか？）。各決定について検討した代替案を列挙する
      - **リスクとトレードオフ**：既知の制限、問題が起き可能性のある箇所。形式：[リスク] → 緩和策
      - **移行方案**：デプロイ手順、ロールバック戦略（該当する場合）
      - **未解決の問題**：まだ解決していない設計上の決定や不明点

      アーキテクチャと方針に焦点を当て、実装を行単位で説明しない。
      動機についてはproposalを、要件についてはspecsを参照すること。

      優れた設計ドキュメントは、技術的決定の背後にある「なぜ」を説明する。
    requires:
      - proposal
  - id: review
    generates: review.md
    description: 4次元レビューとタスク分割の方向性
    template: review.md
    instruction: |
      proposal、specs、designの完全性と品質を4つの次元からレビューする。
      今後生成されるtasks.mdに向けて、分割の方向性と優先順位の提案を提供する。

      レビュー次元：
      1. **境界条件**：Specがnull、空値、範囲外などの異常シナリオをカバーしているか
      2. **ロールバック方案**：変更にロールバック戦略が含まれているか（データベース移行、API変更など）
      3. **テストカバレッジ**：Designがテストすべきシナリオとユースケースを明確にしているか
      4. **後方互換性**：既存のインターフェースとデータへの互換性の影響を分析しているか

      出力形式：
      - 各次元について明確なステータスを示す：✅ 合格 / ⚠️ 警告 / ❌ 不合格
      - 警告と不合格には具体的な提案を必ず含める
      - 全体評価 + tasks分割方向に関する具体的な提案（タスクグループ化の提案、優先順位付け、粒度の基準）

      注意：このレビューはtasks.mdの生成前に実行される。tasks.mdをレビューしたと主張しないこと。specsとdesignに基づいてタスク分割の方向性を予測すること。タスク粒度の実際の検証は、apply後に/opsx:verifyによって実行される。
    requires:
      - proposal
      - specs
      - design
  - id: tasks
    generates: tasks.md
    description: 追跡可能なタスクを含む実装チェックリスト
    template: tasks.md
    instruction: |
      細粒度の実装計画を作成する。各タスクの作業量は2〜5分程度とする。

      ## タスク形式（厳格に遵守すること）

      各タスクは以下の形式に従う必要がある：

      ````markdown
      ### タスク N：[コンポーネント名]

      **関連ファイル：**
      - 新規/修正：exact/path/to/file
      - テスト：tests/exact/path/to/test

      - [ ] **ステップ 1：失敗するテストを書く**
      ```typescript
      test('具体的な動作の説明', () => {
        const result = function(input);
        expect(result).toBe(expected);
      });
      ```

      - [ ] **ステップ 2：テストを実行 — 失敗を確認**
      コマンド：`npx vitest run tests/path/test.ts`
      期待結果：FAIL — function is not defined

      - [ ] **ステップ 3：最小実装を書く**
      ```typescript
      export function function(input: Type): ReturnType {
        return expected;
      }
      ```

      - [ ] **ステップ 4：テストを実行 — 成功を確認**
      コマンド：`npx vitest run tests/path/test.ts`
      期待結果：PASS

      - [ ] **ステップ 5：コミット**
      ```bash
      git add tests/path/test.ts src/path/file.ts
      git commit -m "feat: 具体的な説明"
      ```
      ````

      ## 禁止事項（該当する場合、計画は不適格とみなされる）

      - 「TBD」「TODO」「後で実装」「詳細を記入」
      - 「適切なエラー処理を追加」（具体的なコードを書く必要がある）
      - 「上記のコードのテストを書く」（具体的なテストコードを書く必要がある）
      - 何をするかだけ説明し、どうするかを示さない
      - どのタスクでも定義されていない型や関数を参照する

      ## ルール

      - 正確なファイルパスを指定すること
      - 各ステップには完全なコードを含める — コードの変更に関わるステップは、変更後のコードを表示すること
      - 正確な実行コマンドと期待される出力を指定すること
      - 各テストは1つの動作のみを検証すること
      - DRY、YAGNI — テストをパスする最小実装のみを書く
      - review.mdの提案を参考にタスクの優先順位と分割方向を決定すること
    requires:
      - specs
      - design
      - review
apply:
  requires:
    - tasks
  tracks: tasks.md
  instruction: |
    コンテキストファイルを読み込み、未完了のタスクを順次実行し、完了したものをマークする。
    ブロッカーや明確化が必要な場合は一時停止すること。
